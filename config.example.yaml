# DataHub 运行配置示例（敏感信息不要进代码/不要提交真实值）
#
# 用法：
#   cp config.example.yaml config.yaml   # config.yaml 已被 .gitignore 忽略
#   # 填入真实地址/凭证后启动
#   go run ./cmd/relay
#
# 也可用环境变量 CONFIG_FILE 指定其它路径：CONFIG_FILE=/etc/datahub/config.yaml
#
# 各版本 (x1/v9/v8/zlf/blk/rlbd1/rlbd2/sfzhy/xfjy/tsfx/lxf/grgjj/grsb/sfsm/sffx/dtjd/snhmd/dtly) 对外接口完全一致，仅靠路由名区分：
#   POST /v1/openapi/zlx/querySrmxX1 | ...V9 | ...V8 | ...ZLF | ...BLK | ...RLBD1 | ...RLBD2 | ...SFZHY | ...XFJY | ...TSFX | ...LXF | ...GRGJJ | ...GRSB | ...SFSM | ...SFFX | ...DTJD | ...SNHMD | ...DTLY
#   GET  /v1/openapi/zlx/quotaX1     | ...V9 | ...V8 | ...ZLF | ...BLK | ...RLBD1 | ...RLBD2 | ...SFZHY | ...XFJY | ...TSFX | ...LXF | ...GRGJJ | ...GRSB | ...SFSM | ...SFFX | ...DTJD | ...SNHMD | ...DTLY
# 存储按「域」划分：x1 / v8v9 / zlf / blk / rlbd1 / rlbd2 / sfzhy / xfjy / tsfx / lxf / grgjj / grsb / sfsm / sffx / dtjd / snhmd / dtly 各域独占一套 DB + Redis 逻辑库。
# ★ Redis 逻辑库：本示例文件里 db0~db15 **已全部占满**（dtjd 取 db2、snhmd 取 db5，
#   为最后两个空位），dtly 起只能用 db16+。标准 Redis 只有 0~15 共 16 个库，
#   **新增路由前必须先把实例的 databases 调到 ≥17 或换实例**，
#   不要复用已占用的编号（启动防呆校验会直接拒绝）。
#   真实部署配置的编号分配与本示例不同（config.aliyun.prod.yaml 已用到 db18），
#   改那边时按那边的已用编号顺延。
# v8 与 v9 同属 v8v9 域——共用同一套 license/appKey/secret，但调用次数/成功查得数/
# 操作日志按各自路由独立统计（v8v9 域库内 quota/台账/审计带 route 字段区分）。
# 跨域使用 license 一律鉴权失败。启动时会做防呆校验：两个不同的域配置同一个数据库
# 或同一个 Redis 逻辑库将直接拒绝启动。每条路由各自对接独立上游。
# zlf 转接租赁分V2-D (守信 shouxin168) 上游：AES 加密 biz_data + form 提交。
# blk 转接黑名单因子V35 (应诺尔 enol，与 x1/gama 同端点)：apiKey=blackIntV35、encryptionType=2 (PII 走 MD5)。
# rlbd1/rlbd2 转接人脸身份证比对一所 (数脉)：form POST + sign=md5(appid&timestamp&app_security)，name+idCard+image|url 入参。
#   rlbd1 与 rlbd2 是同一个上游接口，仅 appId/appSecret 不同 (各自独立库/统计/license)。
# sfzhy 转接身份证三要素核验：JSON POST + signature=SHA256(升序 k=v&... + "&AppSecret=" + 商户密钥)，name+idCard+profilePicture 入参。
# xfjy 转接消费交易特征 (data-bean)：JSON POST + sign=MD5(过滤空值升序 k=v&... + "&appkey=" + appkey)，name/idcard/mobile/authlet 入参 (全选填，至少一个查询要素)；有查得(001)/查无(999)。
# tsfx 转接投诉分析识别名单 (kfongtech)：JSON POST + 业务参数 param 走 AES 加密 + 外层 sign，响应 data 为 gzip 压缩结果集；下游仅 mobile 入参，命中级别 C1/C2/C3 由客户端逐档并发查询后整合成 poly 字典经 result.range 透出（每档含 forbid/hit/callee）；至少一档成功即计费(001)，对上游产生 3 次调用。
# lxf 转接灵犀分 score_195_v1 (fullink)：JSON POST + sign=DES/CBC(升序 k=v&... , encryptKey) 大写 hex，name/mobile/idCardNo 传 MD5 摘要；响应 data 为 DES 密文，解密得 300-900 评分经 result.range 透出；分数=-1 视为查无(999)。
# grgjj 转接收入A_g版 (yrzx)：JSON POST + data 走 3DES/ECB/PKCS5+base64 加密、verify=MD5(account+加密前JSON串+reqid+type+key) 大写，name/cid/mobile 入参；响应 result 为 3DES 密文，解密得 {cbjfzt,jfjs,jfsj} 经 result.range 透出；code 001 查得计费 / 999 查无 / 其余(002/003/004/…)上游侧错误。
# grsb 转接背景评估 BJPG-01：JSON POST {data} + data 走 AES/CBC/PKCS5+base64 加密（密钥=encryptKey 的 hex 解码值，IV 固定 16 个 ASCII 字符 "0000000000000000"），请求头带 accountId/prodId；入参仅 idCard+name 两项均必填（**无 mobile**）；响应 data 为同一套 AES 密文，解密得 {xm,sfz,jfdw,grsf,jfjs,cbjfzt,jfsj} 全字段经 result.range 透出；code 200 查得计费 / 2-404 与 3-404 查无 / 其余(2-5xx、3-5xx)上游侧错误不计费。
# sfsm 转接身份证实名核验 (数脉 id_card/check，与 rlbd1/rlbd2 同服务商同签名)：form POST + sign=md5(appid&timestamp&app_security)，入参仅 name+idCard 两项均必填（**无 mobile**）；响应 data 的 {result,desc,sex,birthday,address} 经 result.range 透出、order_no 只落审计；result 0 一致 / 1 不一致 均为收费结论(001) / 2 无记录查无(999) / code≠200 上游侧错误不计费。
# sffx 转接身份风险V107 (应诺尔 enol，与 x1/gama、blk/blacklist 同端点同信封)：apiKey=idRiskTagV107、encryptionType=2 (PII 走 MD5)，入参仅 name+idCard 两项均必填（**无 mobile**）；响应 result 富对象 {detail:[风险类型码A~P+周期码0~6]} 经 result.range 透出；busiCode 10 查得 / 1000 未查得 **均计费**（与同供应商 x1 伽马的 1000 不计费口径相反）。
# dtjd 转接多头借贷行为 (守信 shouxin168，与 zlf/rental 同供应商同端点同信封)：AES/ECB/PKCS5 加密 biz_data + form POST，service=financial_rent_service、mode=mode_loan_intent_v1，入参 name+idCard+mobile 三要素均必填；响应 resp_data 为约 700 个 als_* 多头因子 + Rule_* 决策字段的富对象，整体序列化经 result.range 透出；SW0000 查得计费 / SW0002 查无不计费 / **SW0001 认证失败上游标【收费】但我方按查无且不向下游计费**(落 warn 人工对账)。
# snhmd 转接司南黑名单 (守信 shouxin168，与 zlf/dtjd 同供应商同端点同信封)：AES/ECB/PKCS5 加密 biz_data + form POST，service 同为 financial_rent_service、**mode=mode_compass_black**（同端点区分产品的唯一位），入参 name+idCard+mobile 三要素均必填；响应 resp_data 为 black_list + black_tag04..black_tag12 共 10 个 "0"/"1" 标签的对象，整体序列化经 result.range 透出（black_list=0 未命中黑名单亦属**查得结论**，计费）；SW0000 查得计费 / SW0002 查无不计费 / **SW0001 认证失败本产品标【不收费】→ 按上游侧错误处理**（与兄弟产品 dtjd 的同码口径相反，禁止互相套用）。
#
# 上游按「子源列表」配置：versions.<route>.upstreams 是一个列表。
#   - 单源路由：列表长度 1（当前所有路由均为单源）。
#   同一路由内所有子源 kind 必须一致 (入参校验/信封按路由统一)。
#
# 「自然月结果缓存」按 versions.<route>.cache 配置（默认关闭，见 x1/v9/v8 的示例块）：
# 同一人在同一自然月内的重复查询直接回放本月首查结果，跨月才回源上游。读在关键路径上
# （1 次 Redis GET，约 0.3~1ms），写由异步记账器在响应写回后完成，故命中比回源快得多、
# 未命中几乎无额外开销。缓存与配额计数器共用同域 Redis 逻辑库，靠 qc:* / quota:* 前缀区分。
#   ★ 运维前提：Redis 实例的 maxmemory-policy 必须是 volatile-lru。缓存 key 都带 TTL、
#     配额计数器不带，这样内存吃紧时淘汰压力只落在缓存上，累计计数绝不会被淘汰清零。
#   ★ 只有入参恰好是个人三要素 (name/idCard/mobile) 的路由才允许开启，当前白名单为
#     x1/v8/v9 (见 cmd/relay/main.go cacheableRoutes)。rlbd1/rlbd2/sfzhy(人像照片)、
#     xfjy(授权书编号)、tsfx(命中级别策略) 等入参含额外判别字段的路由开了会返回错答案，
#     配错路由会让启动直接失败。
#
# 注：durations 支持 Go 风格字符串，如 4s / 10s / 5m / 8h。

# HTTP 服务监听地址
addr: ":8080"

upstream:
  # 所有版本共用的上游调用超时
  timeout: "4s"

billing:
  requeryInterval: "10s"   # PENDING 复查间隔

admin:
  # 后台统一登录账号 + JWT（控制面 = x1 版本库）
  bootstrapUser: "admin"
  bootstrapPass: "REPLACE_WITH_ADMIN_PASSWORD"
  jwtSecret: "REPLACE_WITH_ADMIN_JWT_SECRET"
  tokenTTL: "8h"
  spaDir: "web/admin/dist"

# 开发期预置 demo license 的绑定 secret（生产由管理后台为每个用户生成）
demo:
  appSecret: "REPLACE_WITH_DEMO_APP_SECRET"
  seed: false               # 默认 false：不在 postgres 启动时注入 demo license（0004 迁移已从生产清除 demo）；开发/演示可设 true，e2e 由建库脚本 SEED_DEMO=1 播种

# 存储后端 (DESIGN §11): memory（开发/默认）| postgres（生产，每个域独立 PG + Redis）。
storage:
  driver: "memory"          # memory | postgres
  migrationsDir: "migrations"

# PostgreSQL / Redis 全实例共用凭证（填 RDS 高权限账号，阿里云即 pg_rds_superuser 成员；
# 可 CREATE DATABASE + DDL。admin.bootstrapUser 是网页后台，不是 PG 账号）。
pg_base: &pg_base
  host: "REPLACE_WITH_PG_HOST"
  port: 5432
  user: "REPLACE_WITH_PG_ADMIN_USER"
  password: "REPLACE_WITH_PG_ADMIN_PASSWORD"
  sslmode: "disable"
  maxConns: 10

redis_base: &redis_base
  addr: "REPLACE_WITH_REDIS_HOST:6379"
  username: "REPLACE_WITH_REDIS_ADMIN_USER"
  password: "REPLACE_WITH_REDIS_ADMIN_PASSWORD"
  poolSize: 10

# 按路由配置上游 (upstreams 列表)；存储按「域」装配：每个域用其 owner 路由的 database/redis 开库。
# 域 owner：x1→x1, v8v9→v9, zlf→zlf, blk→blk。v8 与 v9 共用 v8v9 域库（同一套
# license），故 v8 无需单列 database/redis。memory 模式下 database/redis 可全省略。
versions:
  x1:
    upstreams:
      - kind: "gama"          # x1 对接上游 A
        baseURL: "REPLACE_WITH_X1_UPSTREAM_DOCHECK_URL"
        appId: "REPLACE_WITH_X1_UPSTREAM_APP_ID"
        appSecret: "REPLACE_WITH_X1_UPSTREAM_APP_SECRET"
        apiKey: "gama_ctmz_layer_score"
    database:
      <<: *pg_base
      name: "datahub_x1_db"
    redis:
      <<: *redis_base
      db: 0
    cache:
      enabled: false                          # 自然月结果缓存开关，默认关闭
      # pepper 是身份指纹的 HMAC 密钥，启用时**必填**（留空启动直接失败）。身份证号
      # 空间可枚举，没有 pepper 的指纹等于裸 SHA-256，Redis 快照泄露即可反查明文身份证。
      # 建议 32 字节以上随机串，与 Redis 凭证分开保管；更换 pepper 等于全量缓存作废。
      pepper: "REPLACE_WITH_X1_CACHE_PEPPER"
      # shareGroup 缺省 = 路由名（各路由互不共享）。x1 与 v8/v9 对接的是不同上游产品，
      # 评分口径不保证一致，切勿混用；确认两条路由数据等价后才可配成同一个值。
      # shareGroup: "x1"
      ttlJitter: "12h"                        # TTL 抖动上界，避免月初海量 key 同时到期打出 CPU 尖刺
      lookupTimeout: "150ms"                  # 缓存读写超时；超时即按未命中回源，不拖慢下游
  # v9 是 v8v9 域的 owner：其 database/redis 即整个 v8v9 域的存储（v8 复用）。
  v9:
    upstreams:
      - kind: "income"        # v9 对接上游 B（GET account/key 验签）
        baseURL: "REPLACE_WITH_V9_UPSTREAM_URL"
        account: "REPLACE_WITH_V9_UPSTREAM_ACCOUNT"
        key: "REPLACE_WITH_V9_UPSTREAM_KEY"
    database:
      <<: *pg_base
      name: "datahub_v8v9_db"
    redis:
      <<: *redis_base
      db: 1
    cache:
      enabled: false
      pepper: "REPLACE_WITH_V9_CACHE_PEPPER"
      ttlJitter: "12h"
      lookupTimeout: "150ms"
  # v8 与 v9 同属 v8v9 域，共用 v9 的库/Redis（同一套 license）。仅配上游；
  # database/redis 不单列，主程序按域 owner(v9) 装配存储。
  v8:
    upstreams:
      - kind: "income"        # v8 对接上游 C（GET account/key 验签）
        baseURL: "REPLACE_WITH_V8_UPSTREAM_URL"
        account: "REPLACE_WITH_V8_UPSTREAM_ACCOUNT"
        key: "REPLACE_WITH_V8_UPSTREAM_KEY"
    # v8 与 v9 缓存写在同一个 Redis 逻辑库里，但 shareGroup 缺省各为自己的路由名，
    # 故键互不相同——v8 查询绝不会读到 v9 写的条目（两者是不同的上游产品）。
    # lookupTimeout 取域 owner(v9) 的配置，此处只需 enabled/pepper。
    cache:
      enabled: false
      pepper: "REPLACE_WITH_V8_CACHE_PEPPER"
      ttlJitter: "12h"
  zlf:
    upstreams:
      - kind: "rental"        # zlf 对接租赁分V2-D（AES 加密 biz_data + form POST）
        baseURL: "https://shouwei.shouxin168.com/api/lightning/product/query"
        institutionId: "REPLACE_WITH_RENTAL_INSTITUTION_ID"
        aesKey: "REPLACE_WITH_RENTAL_AES_KEY"   # AES/ECB/PKCS5Padding 密钥（16/24/32 字节）
        service: "buer_unique_service"          # 可省，默认值
        mode: "mode_rent_score_v2_d"            # 可省，默认值
        # 授权书：固定本地文件，服务启动时上传 OSS 一次并缓存 licenseUrl 复用
        licenseFile: "REPLACE_WITH_LOCAL_AUTH_FILE_PATH"   # 如 ./config/approve.pdf
        licenseType: 1                          # 0:图片(jpg/jpeg/png/bmp) 1:pdf
        oss:
          endpoint: "oss-cn-shanghai.aliyuncs.com"
          accessKeyId: "REPLACE_WITH_OSS_ACCESS_KEY_ID"
          accessKeySecret: "REPLACE_WITH_OSS_ACCESS_KEY_SECRET"
          bucket: "shouwei"
          objectPrefix: "approve_files/"        # 必须以 approve_files/ 开头
    database:
      <<: *pg_base
      name: "datahub_zlf_db"
    redis:
      <<: *redis_base
      db: 3
  blk:
    upstreams:
      - kind: "blacklist"     # blk 对接黑名单因子V35（应诺尔 enol，同 gama 端点 + MD5 信封）
        baseURL: "REPLACE_WITH_BLK_UPSTREAM_DOCHECK_URL"
        appId: "REPLACE_WITH_BLK_UPSTREAM_APP_ID"
        appSecret: "REPLACE_WITH_BLK_UPSTREAM_APP_SECRET"
        apiKey: "blackIntV35"   # 黑名单因子V35 固定产品码
        encryptionType: 2       # 2=MD5：name/idCard/mobile 取 MD5 摘要后入 body 加签
    database:
      <<: *pg_base
      name: "datahub_blk_db"
    redis:
      <<: *redis_base
      db: 4
  rlbd1:
    upstreams:
      - kind: "facecompare"   # rlbd1 对接人脸身份证比对一所（数脉，form POST + md5 签名）
        baseURL: "https://api.shumaidata.com/v4/face_id_card/yisuo/compare"
        appId: "nar7aGqok9Q5x31iWoZFgEtsssE7tq9b"           # 上游 appid
        appSecret: "KKZwRJ6zrlIAEY2RMhh79orZT2VVpq66"   # 上游 app_security（sign 用）
    database:
      <<: *pg_base
      name: "datahub_rlbd1_db"
    redis:
      <<: *redis_base
      db: 6
  sfzhy:
    upstreams:
      - kind: "idverify"   # sfzhy 对接身份证三要素核验（JSON POST + SHA256 签名）
        baseURL: "https://api.cqcucc.com:8443/api/idCardThreeElements"
        appId: "302CcJOpWsT44rToGQEPeA"           # 上游 appId
        appSecret: "4TnKoR4uB4ZIIlRexiOgIDq3IlZLWzs7uBeOlNFfUE7OsKegya21VEqfDCHWJpKLn"   # 上游商户密钥（拼 &AppSecret= 参与签名）
    database:
      <<: *pg_base
      name: "datahub_sfzhy_db"
    redis:
      <<: *redis_base
      db: 7
  # rlbd2：与 rlbd1 同一个人脸身份证比对上游接口，仅换一套 appId/appSecret；
  # 独立成域（独立库 datahub_rlbd2_db / redis db8 / 独立 license 与统计）。
  rlbd2:
    upstreams:
      - kind: "facecompare"
        baseURL: "https://api.shumaidata.com/v4/face_id_card/yisuo/compare"
        appId: "REPLACE_WITH_RLBD2_UPSTREAM_APP_ID"           # 上游 appid（与 rlbd1 不同）
        appSecret: "REPLACE_WITH_RLBD2_UPSTREAM_APP_SECRET"   # 上游 app_security（与 rlbd1 不同）
    database:
      <<: *pg_base
      name: "datahub_rlbd2_db"
    redis:
      <<: *redis_base
      db: 8
  xfjy:
    upstreams:
      - kind: "consumetxn"   # xfjy 对接消费交易特征 (data-bean，JSON POST + MD5 签名)
        baseURL: "https://api.data-bean.cn"
        appId: "REPLACE_WITH_XFJY_SCENEID"        # 上游 sceneid（业务场景标识，参与签名与 nonce）
        appSecret: "REPLACE_WITH_XFJY_APPKEY"     # 上游 appkey（拼 &appkey= 参与 MD5 签名）
        # apiKey: "fk3002"                        # 产品码 procode，缺省 fk3002，通常无需填
    database:
      <<: *pg_base
      name: "datahub_xfjy_db"
    redis:
      <<: *redis_base
      db: 9
  # tsfx 对接「投诉分析识别名单」(kfongtech)：JSON POST，业务参数 param 走 AES 加密，
  # 外层带 apiKey/sign，响应 data 为 gzip 压缩结果集。独立成域（库 datahub_tsfx_db /
  # redis db10 / 独立 license 与统计）。入参 mobile + poly(C1/C2/C3)；调用成功即计费，
  # 命中状态 forbid 随结果数组经 result.range 透出。
  tsfx:
    upstreams:
      - kind: "complaint"
        baseURL: "https://api.kfongtech.com/inlet/api"
        apiKey: "REPLACE_WITH_TSFX_APIKEY"          # 上游 Apikey（外层明文字段）
        aesKey: "REPLACE_WITH_TSFX_AES_KEY"         # param 业务参数 AES 加密密钥
        appSecret: "REPLACE_WITH_TSFX_SIGN_SECRET"  # sign 计算用密钥/salt
    database:
      <<: *pg_base
      name: "datahub_tsfx_db"
    redis:
      <<: *redis_base
      db: 10
  # lxf 对接「灵犀分 score_195_v1」(fullink)：JSON POST，八个字段全必传，
  # name/mobile/idCardNo 传 MD5 摘要，sign = DES/CBC(按参数名升序拼的 k=v&… 串,
  # encryptKey) 大写 hex；响应 data 为同一套 DES 密文，解密得 {"score_195_v1":"600"}。
  # 独立成域（库 datahub_lxf_db / redis db11 / 独立 license 与统计）。
  # 入参 mobile+idCard 必填、name 选填（缺省按上游要求传 MD5("")）。
  # 计费：status=200 且分数≠-1 → 001 查得计费；分数=-1 → 999 查无；非 200 → 上游侧错误不计费。
  # 注意：上游按源 IP 白名单放行（文档「注意事项」第 1 条），部署机出口 IP 需先报上游加白。
  lxf:
    upstreams:
      - kind: "lxscore"
        baseURL: "https://lxf.fullink.tech/report/encode"   # 生产环境
        appId: "REPLACE_WITH_LXF_CUSTOMER_ID"        # 上游 customerId（商户 code）
        apiKey: "REPLACE_WITH_LXF_CUSTOMER_PROD_ID"  # 上游 customerProdId（产品 code）
        appSecret: "REPLACE_WITH_LXF_ENCRYPT_KEY"    # 上游 encryptKey（DES 密钥，兼作 sign 加密与 data 解密；须为 8 个字符或 16 个 hex 字符）
    database:
      <<: *pg_base
      name: "datahub_lxf_db"
    redis:
      <<: *redis_base
      db: 11
  # grgjj 为**双源串行寻源**路由（命中即停）：同一种数据（公积金缴存）挂两个可互相
  # 替代的供应商，按 priority 升序串行查询，第一个查得（001）即停、后续源不再调用（省钱）；
  # 主源查无/失败才回落到备源。两源返回字段都归一到同一份下游契约 {cbjfzt,jfjs,jfsj}，
  # 下游无从察觉背后有几个源。独立成域（库 datahub_grgjj_db / redis db12 / 独立 license 与统计）。
  # 入参 name+idCard+mobile 三要素均必填（网关前置拦截，两源同口径）。
  #   • 主源 incomeag「收入A_g版」(yrzx)：JSON POST，data 走 3DES/ECB/PKCS5Padding 加密后
  #     Base64（明文业务 JSON {name,cid,mobile}），verify=MD5(account+加密前JSON串+reqid+
  #     type+key).toUpperCase()；响应 result 为同一套 3DES 密文，解密得 {cbjfzt,jfjs,jfsj}。
  #     两把独立凭证——key(MD5 加签密钥) 与 aesKey(3DES 密钥)，二者不同。
  #   • 备源 bgjj「备用公积金源」(jeoho)：HTTPS **双向认证**（P12 客户端证书），JSON POST
  #     {merchant_id,timestamp,dsorderid,params,sign}，params 为明文对象 {name,idcard,mobile}，
  #     sign=MD5("k1=v1&…&key=merchantKey")；响应 {code,message,data,orderid}，data
  #     {date,score,jfzt} 映射到 {jfsj,jfjs,cbjfzt}。code 100 查得 / 201 查无 / 其余
  #     (301 非白名单IP…) 上游侧错误不计费。**部署机出口 IP 需先报该源加白**。
  grgjj:
    upstreams:
      # 主源（优先级最高，先查）。
      - kind: "incomeag"
        priority: 0                                  # 越小越先；主源 0，备源 10
        baseURL: "REPLACE_WITH_GRGJJ_UPSTREAM_URL"   # 如 http://server:port/yrzx/common/v2/credit/v2（联调时提供）
        account: "REPLACE_WITH_GRGJJ_ACCOUNT"        # 上游分配的账户 account
        key: "REPLACE_WITH_GRGJJ_SIGN_KEY"           # MD5 verify 加签密钥（上游文档/demo 里的 key）
        aesKey: "REPLACE_WITH_GRGJJ_3DES_KEY"        # 3DES 密钥（Base64 编码，解码后须为 24 字节 DESede 密钥）
      # 备源（优先级更低，主源查无/失败才回落）。
      - kind: "bgjj"
        priority: 10                                 # > 主源，故排在主源之后
        baseURL: "https://pf.jeoho.com/api/nlv2/zl4" # 生产查询接口（联调前需先报出口 IP 加白）
        account: "REPLACE_WITH_BGJJ_MERCHANT_ID"     # 商户号 merchant_id
        key: "REPLACE_WITH_BGJJ_MERCHANT_KEY"        # 商户密钥 merchantKey（MD5 加签用）
        certPath: "REPLACE_WITH_BGJJ_P12_PATH"       # P12 客户端证书文件路径（双向认证，随部署放到服务器）
        certPass: "REPLACE_WITH_BGJJ_P12_PASSWORD"   # P12 证书密码
    database:
      <<: *pg_base
      name: "datahub_grgjj_db"
    redis:
      <<: *redis_base
      db: 12
  # grsb 对接「背景评估 BJPG-01」：JSON POST {data}，data = Base64(AES/CBC/PKCS5(明文业务
  # JSON {idCard,name}))，密钥由 encryptKey **hex 解码**而来（32 个 hex 字符 = AES-128；
  # 直接把字符串当密钥字节会 invalid key size），IV 固定为 16 个 ASCII 字符 "0000000000000000"；
  # 账户与产品经请求头 accountId / prodId 传递。响应 {data,code,uuid,retMsg}，data 为同一套
  # AES 密文，解密得 {xm,sfz,jfdw,grsf,jfjs,cbjfzt,jfsj} 全字段经 result.range 透出。
  # 独立成域（库 datahub_grsb_db / redis db13 / 独立 license 与统计）。
  # 入参仅 name + idCard 两项且均必填（网关前置拦截）——该上游**不要手机号**。
  # 计费：code 200 → 001 查得计费；2-404 / 3-404 → 999 查无不计费；其余 2-5xx、3-5xx
  # （2-501 解密失败 / 2-502 参数不正确 / 2-505 超限额 / 2-508 IP 不在白名单 / 2-509 账户停用
  # / 3-510 查询失败 / 3-506 权限问题 / 3-507 获取数据失败 …）为上游侧错误，不计费。
  # 注意：2-508 表明上游按源 IP 白名单放行，部署机出口 IP 需先报上游加白。
  grsb:
    upstreams:
      - kind: "bgpg"
        baseURL: "http://122.224.147.153:13188/api/getData"   # 生产；测试环境为 :13199/api/getData
        account: "REPLACE_WITH_GRSB_ACCOUNT_ID"    # 请求头 accountId（开户后上游下发）
        apiKey: "BJPG-01"                          # 请求头 prodId（产品编号；可省，缺省 BJPG-01）
        aesKey: "REPLACE_WITH_GRSB_ENCRYPT_KEY"    # encryptKey：hex 文本，解码后须为 16/24/32 字节
    database:
      <<: *pg_base
      name: "datahub_grsb_db"
    redis:
      <<: *redis_base
      db: 13
  # sfsm 对接「身份证实名核验」(数脉 id_card/check)：与 rlbd1/rlbd2 同一服务商、同一套
  # 鉴权——form POST（文档明确「不要 json 方式」）+ sign=md5(appid&timestamp&app_security)。
  # 业务字段只有 name + idcard 两项且均必填（**无 mobile**，网关前置拦截）；secretMode
  # 走缺省不发，即明文传参（若将来要加密：AES/ECB/PKCS5 + Base64，key = app_security）。
  # 响应 {msg,success,code,data{result,order_no,desc,sex,birthday,address}}，业务字段经
  # result.range 透出，order_no 只落审计不透出。
  # 计费：code 200 且 result 0 一致 / 1 不一致 → 001 查得计费（两者上游都明标收费）；
  # result 2 无记录(文档标"预留") → 999 查无不计费；其余（400 参数错误 / 404 资源不存在
  # / 500 系统内部错误 / 501 第三方异常 / 601 未开通权限 / 602 账号停用 / 603 余额不足
  # / 604 接口停用 / 606 调用超限 / 1001 其它）为上游侧错误，不计费。
  # 独立成域（库 datahub_sfsm_db / redis db14 / 独立 license 与统计）。
  sfsm:
    upstreams:
      - kind: "idcheck"
        baseURL: "https://api.shumaidata.com/v4/id_card/check"
        appId: "REPLACE_WITH_SFSM_APPID"          # 上游 appid（服务商分配的唯一标识）
        appSecret: "REPLACE_WITH_SFSM_APP_SECURITY"   # 上游 app_security（sign 用）
    database:
      <<: *pg_base
      name: "datahub_sfsm_db"
    redis:
      <<: *redis_base
      db: 14
  # sffx 对接「身份风险V107」(应诺尔 enol，与 x1/gama、blk/blacklist 同端点同信封)：
  # JSON POST {encryptionType,appId,sign,apiKey,body} + sign=MD5(body 参数按键名 ASCII
  # 升序拼「键值」+ secret) 小写 hex；apiKey 固定 idRiskTagV107；encryptionType=2 时
  # name/idCard 取 MD5 摘要后入 body 并参与加签。
  # 入参仅 name + idCard 两项且均必填（网关前置拦截）——该上游**不要手机号**；文档另有
  # tradeNo(业务单号) 选填，本网关不透传（下游契约无该字段）。
  # 响应 {code,msg,seqNo,data{busiCode,busiMsg,result}}，result 为富对象
  # {"detail":["A0"]}（风险类型码 A~P + 风险周期码 0~6），整体序列化经 result.range 透出；
  # seqNo(交易流水号) 是唯一上游标识，成功/查无/失败三条路径都落审计（uid=logId）。
  # ★ 计费：busiCode 10 查得 → 001 **计费**；1000 数据未查得 → 999 **查无也计费**
  #   （文档 busiCode 表两个码都带【计费】，已在 billing.billNotFoundRoutes 登记 sffx；
  #   注意同供应商的 x1 伽马 1000 **不**计费，口径相反，勿混用）。
  #   其余 1001 余额不足 / 1002 账户信息不存在 / 1003 appId 异常 / 1004 产品编号异常
  #   / 1005 账号信息异常 / 1006 透支余额已达上限 / 1007 数据请求异常 / 1009 服务尚未开通
  #   以及全局 code=-1 响应异常，均为上游侧错误，不计费。
  # 独立成域（库 datahub_sffx_db / redis db15 / 独立 license 与统计）。
  # ★ 接入前需把部署机（阿里云 ECS）出口 IP 报给上游加白（文档 §1.2 合作公司须知）。
  sffx:
    upstreams:
      - kind: "idrisk"
        # 生产域名 enol.com.cn；测试域名 testenol.cn（测试账号仅返回挡板数据）。
        # 注：文档 §3.2 Demo 里的地址是 https://api.enolfax.com/enol/api/v1/doCheck，
        # 与 §2.1 的域名表不一致——联调时以上游实际下发的域名为准。
        baseURL: "https://enol.com.cn/enol/api/v1/doCheck"
        appId: "REPLACE_WITH_SFFX_UPSTREAM_APP_ID"
        appSecret: "REPLACE_WITH_SFFX_UPSTREAM_APP_SECRET"
        apiKey: "idRiskTagV107"   # 身份风险V107 固定产品码
        encryptionType: 2         # 2=MD5：name/idCard 取 MD5 摘要后入 body 加签
    database:
      <<: *pg_base
      name: "datahub_sffx_db"
    redis:
      <<: *redis_base
      db: 15
  # dtjd 对接「多头借贷行为」(守信 shouxin168)：与 zlf/rental **同一供应商、同一端点、
  # 同一信封**——业务数据 JSON 经 AES/ECB/PKCS5Padding + Base64 放进 biz_data，与
  # institution_id 一起 form POST；仅 service/mode 与响应主体不同。
  # 入参 name + idCard + mobile 三要素**均必填**（上游 §2.5 业务数据表三项全标必传，
  # 网关前置拦截）；licenseUrl/licenseType 是我方启动时上传授权书到 OSS 后缓存的固定值。
  # 响应 {resp_code,resp_msg,resp_order,timestamp,resp_data}，resp_data 是约 700 个
  # als_* 多头借贷因子 + Rule_* 决策字段（Rule_final_decision Accept/Reject/Review、
  # Rule_final_weight 评分、Rule_name_*/Rule_weight_* 命中规则）的富对象，
  # 整体序列化经 result.range 透出（与 blk/sffx 同口径）；resp_order 是唯一上游标识，
  # 成功/查无/失败三条路径都落审计（uid=logId）。
  # ★ 计费：SW0000 认证成功【上游收费】→ 001 查得计费；SW0002 查询无记录 不收费 → 999；
  #   **SW0001 认证失败上游标【收费】，但我方按「下游查无 + 不计费」处理**（落 warn
  #   人工对账）——SW0001 与 SW0002 都归一到 999 而计费口径相反，无法用
  #   billing.billNotFoundRoutes（整条路由 999 一刀切）区分，故 dtjd **不在**该表里。
  #   其余 SW0003 通道超时 / SW0017 biz_data参数错误 / SW0018 参数错误 / SW003x 验签解密
  #   / SW0040 产品未开通 / SW0041 调用量上限 / SW0042 余额不足 / SW10xx 格式有误
  #   / SW9999 系统错误 均为上游侧错误，不计费。
  # 独立成域（库 datahub_dtjd_db / redis db2 / 独立 license 与统计）。
  # ★ 接入前需把部署机（阿里云 ECS）出口 IP 报给上游加白（文档「需要添加服务器白名单」）；
  #   非白名单来源在 TLS 层即被断开，拿不到任何业务报文——那是环境问题不是协议问题。
  dtjd:
    upstreams:
      - kind: "multiloan"
        # 生产；测试(沙箱)环境为 http://sit-shouwei.shouxin168.com/sandbox/lightning/product/query
        baseURL: "https://shouwei.shouxin168.com/api/lightning/product/query"
        institutionId: "REPLACE_WITH_DTJD_INSTITUTION_ID"
        aesKey: "REPLACE_WITH_DTJD_AES_KEY"       # AES/ECB/PKCS5Padding 密钥（16/24/32 字节；hex/Base64 形态会自动解码）
        service: "financial_rent_service"         # 可省，默认值
        mode: "mode_loan_intent_v1"               # 可省，默认值
        # 授权书：固定本地文件，服务启动时上传 OSS 一次并缓存 licenseUrl 复用
        licenseFile: "REPLACE_WITH_LOCAL_AUTH_FILE_PATH"   # 如 ./config/approve.pdf
        licenseType: 1                            # 0:图片(jpg/jpeg/png/bmp) 1:pdf
        # OSS：dtjd/snhmd/dtly 三条共用同一套凭证（上游 2026-09-24 确认）。
        # ⚠️ zlf 虽同为守信，但**不在共用范围内**，其 oss 块独立，勿互相套用。
        oss:
          endpoint: "oss-cn-shanghai.aliyuncs.com"
          accessKeyId: "REPLACE_WITH_OSS_ACCESS_KEY_ID"
          accessKeySecret: "REPLACE_WITH_OSS_ACCESS_KEY_SECRET"
          bucket: "shouwei"
          objectPrefix: "approve_files/"          # 必须以 approve_files/ 开头
    database:
      <<: *pg_base
      name: "datahub_dtjd_db"
    redis:
      <<: *redis_base
      # 本示例文件里 db2 与 db5 尚未被占用，dtjd 取 db2（仍在标准 0~15 范围内）。
      # ⚠️ 真实部署配置的编号分配与本示例**不同**（config.aliyun.prod.yaml 里 dtjd 取
      # db2、snhmd 取 db5、dtly 取 db15，该文件仅剩 db0/db1 空闲），改那个文件时务必
      # 另取未占用的编号——启动防呆校验 (checkStorageIsolation) 会拒绝两个域共用同一
      # 个 Redis 逻辑库。
      db: 2
  # snhmd 对接「司南黑名单」(守信 shouxin168)：与 zlf/dtjd **同一供应商、同一端点、
  # 同一信封**——业务数据 JSON 经 AES/ECB/PKCS5Padding + Base64 放进 biz_data，与
  # institution_id 一起 form POST。service 与那两条相同，**唯一的区分位是
  # mode=mode_compass_black**：同端点靠 mode 选产品，抄成别的 mode 会静默查到另一个
  # 产品的数据（不报错，更难发现）。institutionId/aesKey 按产品分配，**不要假定与
  # zlf/dtjd 共用同一把密钥**。
  # 入参 name + idCard + mobile 三要素**均必填**（上游 §2.5 业务数据表三项全标必传，
  # 网关前置拦截）；licenseUrl/licenseType 是我方启动时上传授权书到 OSS 后缓存的固定值。
  # 响应 {resp_code,resp_msg,resp_order,timestamp,resp_data}，resp_data 是 black_list
  # 与 black_tag04..black_tag12 共 10 个 "0"/"1" 标签的对象（1 命中 / 0 未命中：
  # black_list 是否命中黑名单、tag04 短期频繁还款失败、tag05 短期频繁借贷、tag06 短期新
  # 机构频繁借贷、tag07 短期还款失败比例高、tag08 短期多机构逾期、tag09 中期频繁还款
  # 失败、tag10 短期新机构频繁还款失败、tag11 当前逾期较严重、tag12 高风险客户），
  # 整体序列化经 result.range 透出（与 blk/sffx/dtjd 同口径）；resp_order 是唯一上游
  # 标识，成功/查无/失败三条路径都落审计（uid=logId）。
  # ★ 计费：SW0000 认证成功【上游收费】→ 001 查得计费（**black_list=0 未命中黑名单同样
  #   是有效结论，属查得，照常计费**，不得因为标签全 0 就改判 999）；SW0002 查询无记录
  #   不收费 → 999；**SW0001 认证失败本产品文档标【不收费】→ 按上游侧错误返回不计费**。
  #   ⚠️ 兄弟产品 dtjd 的同一个 SW0001 标的是【收费】、被迫归一成 999——两份文档口径
  #   相反，**禁止互相套用**。因本路由的 999 只来自 SW0002，故与 dtjd 一样都**不在**
  #   billing.billNotFoundRoutes 里，但理由不同。
  #   其余 SW0003 通道超时 / SW0017 biz_data参数错误 / SW0018 参数错误 / SW003x 验签解密
  #   / SW0040 产品未开通 / SW0041 调用量上限 / SW0042 余额不足 / SW10xx 格式有误
  #   / SW9999 系统错误 均为上游侧错误，不计费。
  # 独立成域（库 datahub_snhmd_db / redis db5 / 独立 license 与统计）。
  # ★ 接入前需把部署机（阿里云 ECS）出口 IP 报给上游加白（文档「需要添加服务器白名单」）；
  #   非白名单来源在 TLS 层即被断开，拿不到任何业务报文——那是环境问题不是协议问题。
  snhmd:
    upstreams:
      - kind: "compassblack"
        # 生产；测试(沙箱)环境为 http://sit-shouwei.shouxin168.com/sandbox/lightning/product/query
        baseURL: "https://shouwei.shouxin168.com/api/lightning/product/query"
        institutionId: "REPLACE_WITH_SNHMD_INSTITUTION_ID"
        aesKey: "REPLACE_WITH_SNHMD_AES_KEY"       # AES/ECB/PKCS5Padding 密钥（16/24/32 字节；hex/Base64 形态会自动解码）
        service: "financial_rent_service"          # 可省，默认值
        mode: "mode_compass_black"                 # 可省，默认值；**这是区分产品的唯一位**
        # 授权书：固定本地文件，服务启动时上传 OSS 一次并缓存 licenseUrl 复用
        licenseFile: "REPLACE_WITH_LOCAL_AUTH_FILE_PATH"   # 如 ./config/approve.pdf
        licenseType: 1                             # 0:图片(jpg/jpeg/png/bmp) 1:pdf，与 licenseFile 真实类型一致
        # OSS：dtjd/snhmd/dtly 三条共用同一套凭证（上游 2026-09-24 确认）。
        # ⚠️ zlf 虽同为守信，但**不在共用范围内**，其 oss 块独立，勿互相套用。
        oss:
          endpoint: "oss-cn-shanghai.aliyuncs.com"
          accessKeyId: "REPLACE_WITH_OSS_ACCESS_KEY_ID"
          accessKeySecret: "REPLACE_WITH_OSS_ACCESS_KEY_SECRET"
          bucket: "shouwei"
          objectPrefix: "approve_files/"           # 必须以 approve_files/ 开头
    database:
      <<: *pg_base
      name: "datahub_snhmd_db"
    redis:
      <<: *redis_base
      # db5 是本示例文件 0~15 里最后一个空位，取它之后本文件已排满（见文件头 ★）。
      # ⚠️ 真实部署配置（config.aliyun.prod.yaml）另有编号分配，别照抄这里的 5。
      db: 5
  # dtly 对接「多头履约行为」(守信 shouxin168)：与 zlf/dtjd/snhmd **同一供应商、同一
  # 端点、同一信封**——业务数据 JSON 经 AES/ECB/PKCS5Padding + Base64 放进 biz_data，
  # 与 institution_id 一起 form POST。service 与 dtjd/snhmd 相同，**唯一的区分位是
  # mode=mode_many_overdue_behavior**：同端点靠 mode 选产品，抄成别的 mode 会静默查到
  # 另一个产品的数据（不报错，更难发现）。institutionId/aesKey 按产品分配，**不要假定
  # 与 zlf/dtjd/snhmd 共用同一把密钥**。
  # 入参 name + idCard + mobile 三要素**均必填**（上游 §2.5 业务数据表三项全标必传，
  # 网关前置拦截）；licenseUrl/licenseType 是我方启动时上传授权书到 OSS 后缓存的固定值。
  # 响应 {resp_code,resp_msg,resp_order,timestamp,resp_data}，resp_data 是357 个扁平
  # 因子的富对象：xyp_cpl00xx 多头履约/逾期因子、xyp_t01/t02/t03td/t04 分层履约因子、
  # xyp_model_score_high/mid/low 三个星耀Pro 评分（[350,950]，越大逾期率越低，未命中
  # -1）、xyp_var1..10 预留字段。**绝大多数因子是区间化档位输出**（0=0、空=缺失、
  # -1=负数，逐字段阈值见 docs/上游对接_多头履约行为_守信_钉钉文档整理.md 附录 A），
  # 网关不解释语义、整体序列化经 result.range 透出（与 blk/sffx/dtjd/snhmd 同口径）；
  # resp_order 是唯一上游标识，成功/查无/失败三条路径都落审计（uid=logId）。
  # ★ 计费：SW0000 认证成功【上游收费】→ 001 查得计费（**示例里因子大多为空串、模型分
  #   为 -1 未命中，同样是有效结论，属查得，照常计费**；仅 resp_data 整体缺失/null/空
  #   对象才按拿不到数据的上游侧错误处理、不计费）；SW0002 查询无记录 不收费 → 999；
  #   **SW0001 认证失败本产品文档标【不收费】→ 按上游侧错误返回不计费**（同 snhmd）。
  #   ⚠️ 兄弟产品 dtjd 的同一个 SW0001 标的是【收费】、被迫归一成 999——两份文档口径
  #   相反，**禁止互相套用**。因本路由的 999 只来自 SW0002，故**不在**
  #   billing.billNotFoundRoutes 里。
  #   其余 SW0003 通道超时 / SW0017 biz_data参数错误 / SW0018 参数错误 / SW003x 验签解密
  #   / SW0040 产品未开通 / SW0041 调用量上限 / SW0042 余额不足 / SW10xx 格式有误
  #   / SW9999 系统错误 均为上游侧错误，不计费。
  # 独立成域（库 datahub_dtly_db / redis db16 / 独立 license 与统计）。
  # ★ 接入前需把部署机（阿里云 ECS）出口 IP 报给上游加白（文档「需要添加服务器白名单」）；
  #   非白名单来源在 TLS 层即被断开，拿不到任何业务报文——那是环境问题不是协议问题。
  dtly:
    upstreams:
      - kind: "manyoverdue"
        # 生产；测试(沙箱)环境为 http://sit-shouwei.shouxin168.com/sandbox/lightning/product/query
        baseURL: "https://shouwei.shouxin168.com/api/lightning/product/query"
        institutionId: "REPLACE_WITH_DTLY_INSTITUTION_ID"
        aesKey: "REPLACE_WITH_DTLY_AES_KEY"        # AES/ECB/PKCS5Padding 密钥（16/24/32 字节；hex/Base64 形态会自动解码）
        service: "financial_rent_service"          # 可省，默认值
        mode: "mode_many_overdue_behavior"         # 可省，默认值；**这是区分产品的唯一位**
        # 授权书：固定本地文件，服务启动时上传 OSS 一次并缓存 licenseUrl 复用
        licenseFile: "REPLACE_WITH_LOCAL_AUTH_FILE_PATH"   # 如 ./config/approve.pdf
        licenseType: 1                             # 0:图片(jpg/jpeg/png/bmp) 1:pdf，与 licenseFile 真实类型一致
        # OSS：dtjd/snhmd/dtly 三条共用同一套凭证（上游 2026-09-24 确认）。
        # ⚠️ zlf 虽同为守信，但**不在共用范围内**，其 oss 块独立，勿互相套用。
        oss:
          endpoint: "oss-cn-shanghai.aliyuncs.com"
          accessKeyId: "REPLACE_WITH_OSS_ACCESS_KEY_ID"
          accessKeySecret: "REPLACE_WITH_OSS_ACCESS_KEY_SECRET"
          bucket: "shouwei"
          objectPrefix: "approve_files/"           # 必须以 approve_files/ 开头
    database:
      <<: *pg_base
      name: "datahub_dtly_db"
    redis:
      <<: *redis_base
      # ⚠️ 本示例文件的 db0~db15 在 snhmd 之后已排满，故 dtly 只能取 db16——
      # **标准 Redis 默认只有 0~15**，用这个编号前必须先把实例的 `databases` 调到 ≥17
      # （或换实例），否则连库即失败。真实部署配置另有编号分配，别照抄这里的 16。
      db: 16
